name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install flake8 black
      - run: flake8 src/ tests/ --max-line-length=120 --ignore=E501,W503
      - run: black --check src/ tests/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pandas scipy scikit-learn xgboost prophet \
            shap statsmodels streamlit fastapi uvicorn httpx sqlalchemy \
            plotly folium pydantic requests tqdm pyyaml pytest pytest-cov
      - name: Generate synthetic data
        run: python data/synthetic/generate_synthetic.py --output-dir data/processed
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t cholera-zim:ci .
